<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Pathology Triage — ASUS GX10</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="header">
      <h2>Pathology Triage</h2>
      <div id="counter-badge">⚡ <span id="gb-counter">0</span> GB Analyzed</div>
      <div class="local-pitch-text">Local processing: 0 bytes uploaded to cloud</div>
      
      <button id="heatmap-toggle-btn" class="btn-heatmap" onclick="toggleHeatmap()">
        🗺️ AI Heatmap: ON
      </button>
    </div>
    <div id="queue"></div>

    <div id="roi-panel"></div>
  </div>

  <div id="main">
    <div id="viewer"></div>
    
    <div id="report-panel">
      <div class="report-header">
        <h3>Clinical Report</h3>
        <button class="btn-close" onclick="document.getElementById('report-panel').style.display='none'">✕</button>
      </div>
      <div id="report-content">Loading...</div>
    </div>
    
    <div class="report-trigger">
      <button class="btn-primary" onclick="fetchReport()">📋 One-Click Report</button>
    </div>
  </div>

  <script src="/static/viewer.js"></script>
</body>
</html>
